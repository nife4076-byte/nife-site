<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #fe00b2;
  --purple: #6000ba;
  --lilac: #ae60ff;
  --dark: #04000a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--dark);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  padding: 16px;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(254,0,178,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(254,0,178,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 20s linear infinite;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 50%, rgba(96,0,186,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 50%, rgba(254,0,178,0.08) 0%, transparent 60%);
  z-index: 0;
  animation: ambientShift 8s ease-in-out infinite alternate;
}
@keyframes gridMove { from { background-position: 0 0; } to { background-position: 40px 40px; } }
@keyframes ambientShift { from { opacity: 0.7; } to { opacity: 1; } }

.widget {
  position: relative; z-index: 1;
  width: 100%; max-width: 580px;
  display: flex; flex-direction: column; gap: 14px;
}

/* ── PANEL ── */
.panel {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(6,0,14,0.92);
}
#msg-panel {
  background: rgba(25,0,60,0.97);
}
.panel::before {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 18px;
  box-shadow: 0 0 20px rgba(254,0,178,0.5), 0 0 50px rgba(254,0,178,0.2), 0 0 100px rgba(96,0,186,0.2);
  z-index: -1;
  animation: glowPulse 3s ease-in-out infinite alternate;
}
@keyframes glowPulse {
  from { box-shadow: 0 0 15px rgba(254,0,178,0.4), 0 0 40px rgba(254,0,178,0.2), 0 0 80px rgba(96,0,186,0.15); }
  to   { box-shadow: 0 0 30px rgba(254,0,178,0.8), 0 0 70px rgba(254,0,178,0.3), 0 0 130px rgba(96,0,186,0.3); }
}

/* animated gradient border */
.panel-border {
  position: absolute; inset: 0;
  border-radius: 16px;
  padding: 3px;
  background: linear-gradient(to bottom, #6000ba, #fe00b2); /* vertical gradient */
  box-shadow: 0 0 18px rgba(254,0,178,0.7), 0 0 40px rgba(254,0,178,0.5);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  z-index: 10; pointer-events: none;
}

/* ── IMAGE BOX ── */
#image-panel { aspect-ratio: 16 / 9; }

#img-bg {
  position: absolute; inset: 0;
  background-image: url('https://i.postimg.cc/qRmGgprV/tumblr-o5a5r9Z9O71tvppquo1-r1-1280.webp');
  background-size: cover;
  background-position: center;
  border-radius: 16px;
  filter: brightness(0.72) saturate(1.2);
  z-index: 1;
}

.scanlines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
  border-radius: 16px;
  pointer-events: none; z-index: 5;
}
.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
  border-radius: 16px;
  pointer-events: none; z-index: 4;
}
.img-fade {
  position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
  background: linear-gradient(to top, rgba(4,0,10,0.88) 0%, transparent 100%);
  border-radius: 0 0 16px 16px;
  z-index: 5; pointer-events: none;
}

/* ── CLOCK ── */
.clock-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 8; pointer-events: none;
}
.clock-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(10px, 1.8vw, 13px);
  font-weight: 600; letter-spacing: 6px;
  color: var(--lilac);
  text-shadow: 0 0 10px var(--lilac), 0 0 25px rgba(174,96,255,0.5);
  text-transform: uppercase; margin-bottom: 6px;
}
#time-display {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(52px, 15vw, 100px);
  letter-spacing: 2px; line-height: 1;
  color: #fff;
  text-shadow: 0 0 2px #fff, 0 0 12px var(--pink), 0 0 30px var(--pink), 0 0 60px rgba(254,0,178,0.7), 0 0 110px rgba(254,0,178,0.3);
  /* removed flicker */
}
.colon { display: inline-block; color: var(--pink); } /* removed blinking */

#ampm-badge {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
  background: rgba(254,0,178,0.12);
  border: 1px solid rgba(254,0,178,0.45);
  border-radius: 4px; padding: 3px 14px 3px 10px;
  backdrop-filter: blur(6px);
}
.ampm-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 0 10px var(--pink), 0 0 20px rgba(254,0,178,0.6);
  /* removed pulsing */
}
#ampm-display {
  font-family: 'Orbitron', monospace; font-weight: 700;
  font-size: clamp(14px, 3vw, 22px); letter-spacing: 4px;
  color: var(--pink);
  text-shadow: 0 0 10px var(--pink), 0 0 25px rgba(254,0,178,0.5);
}

/* ── MESSAGE PANEL ── */
.msg-inner { padding: 22px 28px 24px; }
.msg-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(254,0,178,0.2);
}
.msg-header-icon {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 0 10px var(--pink), 0 0 20px rgba(254,0,178,0.5);
  animation: dotPulse 1.5s ease-in-out infinite alternate;
}
.msg-header-text {
  font-family: 'Orbitron', monospace; font-size: 10px;
  letter-spacing: 4px; color: var(--pink);
  text-shadow: 0 0 10px rgba(254,0,178,0.5);
  text-transform: uppercase; font-weight: 400;
}

.msg-body {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(13px, 2.2vw, 15px);
  font-weight: 400; line-height: 1.85;
  color: rgba(255,210,255,0.92); letter-spacing: 0.3px;
}
.msg-body .highlight {
  color: var(--pink); font-weight: 600;
  text-shadow: 0 0 8px rgba(254,0,178,0.5);
}
.cursor {
  display: inline-block; width: 8px; height: 14px;
  background: var(--pink); box-shadow: 0 0 6px var(--pink);
  animation: cursorBlink 1.1s step-end infinite;
  vertical-align: middle; margin-left: 2px;
}

.msg-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid rgba(174,96,255,0.15);
}
.msg-footer-tag {
  font-family: 'Orbitron', monospace; font-size: 9px;
  letter-spacing: 3px; color: rgba(174,96,255,0.4);
}
@keyframes dotPulse { from { opacity:0.5; transform:scale(0.8); } to { opacity:1; transform:scale(1.2); } }
@keyframes cursorBlink { 0%,100% { opacity:1; } 50% { opacity:0; } }
</style>
</head>
<body>
<div class="widget">

  <!-- IMAGE / CLOCK PANEL -->
  <div class="panel" id="image-panel">
    <div class="panel-border"></div>
    <div id="img-bg"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="img-fade"></div>
    <div class="clock-overlay">
      <div class="clock-label">Eastern Standard Time</div>
      <div id="time-display">00<span class="colon">:</span>00<span class="colon">:</span>00</div>
      <div id="ampm-badge">
        <span class="ampm-dot"></span>
        <span id="ampm-display">AM</span>
      </div>
    </div>
  </div>

  <!-- MESSAGE PANEL -->
  <div class="panel" id="msg-panel">
    <div class="panel-border"></div>
    <div class="msg-inner">
      <div class="msg-header">
        <div class="msg-header-icon"></div>
        <div class="msg-header-text">System Message</div>
      </div>
      <div class="msg-body">
        Hi! I'm assuming you're here because you want to see what time it is for me.
        <span class="highlight">Please do not ping me between 12am – 6am</span> if possible,
        and if I'm not online, do not spam me — I will be on soon. Thanks!
        <span class="cursor"></span>
      </div>
      <div class="msg-footer">
        <span class="msg-footer-tag">// AUTO-UPDATED · EST</span>
        <span class="msg-footer-tag" id="date-display"></span>
      </div>
    </div>
  </div>

</div>

<script>
function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleString('en-US', {
    timeZone: 'America/Toronto',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  const dateStr = now.toLocaleString('en-US', {
    timeZone: 'America/Toronto',
    weekday: 'short', month: 'short', day: 'numeric'
  });
  const parts = timeStr.match(/(\d+):(\d+):(\d+)\s(AM|PM)/);
  if (!parts) return;
  const [, h, m, s, ampm] = parts;
  document.getElementById('time-display').innerHTML =
    `${h}<span class="colon">:</span>${m}<span class="colon">:</span>${s}`;
  document.getElementById('ampm-display').textContent = ampm;
  document.getElementById('date-display').textContent = dateStr.toUpperCase();
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
