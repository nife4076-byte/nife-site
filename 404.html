<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Nife</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/profile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09070a;
    --border:rgba(255,68,56,0.16);
    --border-strong:rgba(255,68,56,0.35);
    --text:#f6f1f2;
    --muted:#a58e92;
    --deep:#9b0000;
    --red:#ff4438;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  .backdrop{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(1100px 620px at 50% -6%, rgba(155,0,0,0.38), transparent 60%),
      radial-gradient(700px 500px at 88% 18%, rgba(255,68,56,0.14), transparent 65%),
      var(--bg);
  }
  .bg-icons{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-icons img{
    position:absolute;
    opacity:0.06;
  }

  .logo{
    position:fixed;
    top:calc(24px + var(--banner-h, 0px));left:24px;
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:18px;
    z-index:10;
  }
  .logo img{width:26px;height:26px;border-radius:7px;object-fit:cover;}

  main{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:calc(100px + var(--banner-h, 0px)) 24px 40px;
  }
  .code{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:clamp(80px,18vw,160px);
    line-height:1;
    background:linear-gradient(135deg, #fff, var(--red) 130%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:6px;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:clamp(20px,3vw,28px);
    margin:0 0 10px;
  }
  p{
    color:var(--muted);
    font-size:15px;
    max-width:380px;
    line-height:1.6;
    margin:0 0 32px;
  }
  .btn{
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 26px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--red), var(--deep));
    color:#fff;
    box-shadow:0 10px 30px -8px rgba(255,68,56,0.55);
    transition:transform .15s, box-shadow .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px -8px rgba(255,68,56,0.75);}

  /* ---------- ANNOUNCEMENT BANNER ---------- */
  #site-announcement{
    position:fixed;
    top:0;left:0;right:0;
    z-index:200;
    background:linear-gradient(135deg, var(--red), var(--deep));
    border-bottom:1px solid rgba(255,255,255,0.14);
    box-shadow:0 4px 18px -6px rgba(255,68,56,0.55);
  }
  .announcement-inner{
    max-width:1180px;
    margin:0 auto;
    padding:8px 24px;
    text-align:center;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.02em;
    color:#fff;
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="bg-icons">
    <img src="images/knife-red.png" style="top:4%;left:3%;width:110px;transform:rotate(-18deg);opacity:0.07;">
    <img src="images/knife-red.png" style="top:12%;right:8%;width:90px;transform:rotate(12deg);opacity:0.06;">
    <img src="images/knife-red.png" style="top:30%;left:12%;width:75px;transform:rotate(-6deg);opacity:0.05;">
    <img src="images/knife-red.png" style="top:0%;right:26%;width:135px;transform:rotate(24deg);opacity:0.05;">
    <img src="images/knife-red.png" style="top:46%;right:4%;width:95px;transform:rotate(-14deg);opacity:0.05;">
    <img src="images/knife-red.png" style="top:58%;left:6%;width:80px;transform:rotate(20deg);opacity:0.06;">
    <img src="images/knife-red.png" style="top:72%;left:38%;width:100px;transform:rotate(-30deg);opacity:0.04;">
    <img src="images/knife-red.png" style="top:80%;right:16%;width:70px;transform:rotate(8deg);opacity:0.06;">
  </div>
</div>

<a href="/" class="logo">
  <img src="images/profile.png" alt="">
  NIFE
</a>

<main>
  <div class="code">404</div>
  <h1>This page got cut</h1>
  <p>Whatever you were looking for isn't here. Might've been moved, renamed, or never existed in the first place.</p>
  <a href="/" class="btn">Back to nifeminecraft.com</a>
</main>

<script src="announcement.js"></script>
</body>
</html>
