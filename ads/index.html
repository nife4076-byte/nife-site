<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nife</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../images/profile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1068078723050037" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#09070a;
    --panel:#160c10;
    --border:rgba(255,68,56,0.16);
    --text:#f6f1f2;
    --muted:#a58e92;
    --red:#ff4438;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(155,0,0,0.28), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:17px;
    margin-bottom:40px;
    color:var(--text);
    text-decoration:none;
  }
  .logo img{width:24px;height:24px;border-radius:6px;object-fit:cover;}
  h1{
    font-family:'Sora',sans-serif;
    font-size:clamp(22px,4vw,30px);
    text-align:center;
    max-width:480px;
    margin:0 0 10px;
  }
  p{
    color:var(--muted);
    text-align:center;
    max-width:420px;
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 40px;
  }
  .ad-slot{
    width:100%;
    max-width:728px;
    min-height:280px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  a.back{
    margin-top:40px;
    color:var(--red);
    font-size:13.5px;
    text-decoration:underline;
    font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>
  <a href="/" class="logo">
    <img src="../images/profile.png" alt="">
    NIFE
  </a>
  <h1>Thanks for stopping by</h1>
  <p>This page helps support the site. Feel free to look around — real ads will appear here once everything's fully approved.</p>

  <div class="ad-slot">
    <ins class="adsbygoogle"
         style="display:block; width:100%;"
         data-ad-client="ca-pub-1068078723050037"
         data-ad-slot="8543168523"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <a href="/" class="back">← Back to nifeminecraft.com</a>
</body>
</html>
